name: Supabase Keep-Alive

# Supabase 무료 플랜은 7일 미접속 시 프로젝트 자동 pause 됨.
# 이 워크플로가 하루 3번(8시간마다) 사이트 + DB 에 요청 보내서 활동 유지.
# 완전 무료 (GitHub Actions 무료 할당량 안에서 실행).

on:
  schedule:
    # 매일 UTC 00:00, 08:00, 16:00 (KST 09:00, 17:00, 01:00)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live site
        run: |
          echo "Pinging Cloudflare Pages site..."
          curl -sSf -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" https://promotion-admin-ati.pages.dev/ || echo "site ping failed (continuing)"

      - name: Ping Supabase REST (if URL secret set)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "Pinging Supabase..."
            curl -sSf -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/vendors?select=id&limit=1" \
              || echo "supabase ping failed (continuing)"
          else
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets not set, skipping DB ping"
          fi
